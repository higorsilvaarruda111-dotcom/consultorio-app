<style>

*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}

nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;background:var(--c);border:1px solid var(--b);border-radius:20px;box-shadow:var(--sh);padding:6px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:var(--m);font:inherit;font-size:11px;border-radius:14px;cursor:pointer;transition:background .15s,color .15s}

.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.5px}
.bn{font-weight:700;font-size:16px;line-height:1.15}.bs{font-size:12px;color:var(--m)}

 .side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);padding:24px 14px;display:flex;flex-direction:column;gap:26px}

 nav{position:static;flex-direction:column;background:none;border:0;box-shadow:none;padding:0;gap:4px}

}
.card{min-width:0;background:var(--c);border:1px solid var(--b);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
h2{margin:6px 0 2px;font-size:24px;letter-spacing:-.3px}h3{margin:0 0 10px;font-size:16px}

.ki{width:36px;height:36px;border-radius:12px;background:var(--a2);color:var(--a);display:grid;place-items:center;margin-bottom:10px}
.open{border:1.5px dashed var(--wn)}.open .ki{background:var(--wnb);color:var(--wn)}.open.and{border-color:var(--a)}.open.and .ki{background:var(--a2);color:var(--a)}.open .k{font-size:21px}
.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}
.row .r{text-align:right;white-space:nowrap}
.row.hl{background:var(--a2);border-radius:12px;padding:12px;border:0;margin-top:6px}
.bad{color:var(--bad)}.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--b);color:var(--m);white-space:nowrap}
.tag.warn{background:var(--wnb);color:var(--wn);border-color:transparent}.tag.ok{background:var(--okb);color:var(--ok);border-color:transparent}
a.l{color:var(--a);cursor:pointer;font-weight:500}
.seg{display:inline-flex;background:var(--a2);padding:4px;border-radius:14px;margin:8px 0 10px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:10px;font:inherit;color:var(--m);cursor:pointer}
.seg .on{background:var(--c);color:var(--a);font-weight:600;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--b);background:var(--c);color:var(--t);padding:8px 13px;border-radius:99px;font:inherit;font-size:13.5px;cursor:pointer;transition:background .15s}
.chip.on{background:var(--a);border-color:var(--a);color:var(--bt)}.chip.sm{font-size:12.5px;padding:6px 11px}
.pk{background:var(--bg);border-radius:14px;padding:12px;margin:8px 0}
.plist{max-height:300px;overflow:auto;border:1px solid var(--b);border-radius:12px;background:var(--c)}
.prow{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--b);cursor:pointer}.prow:last-child{border:0}
.prow:hover{background:var(--a2)}.prow.on{background:var(--a2);font-weight:600}
.psel{display:grid;gap:8px;background:var(--a2);border-radius:14px;padding:12px;margin-top:10px}.psel input{margin:0}
details.cat{border:1px solid var(--b);border-radius:14px;margin:8px 0;padding:0 14px;background:var(--c)}
details.cat summary{display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer;font-weight:600;list-style:none}
details.cat summary::-webkit-details-marker{display:none}details.cat[open]>summary{border-bottom:1px solid var(--b)}
details.cat>button{margin:10px 0 12px}
.subh{font-weight:600;font-size:13px;margin:14px 0 2px;display:flex;justify-content:space-between;align-items:center}
.e{padding:8px 0}.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.info{overflow-wrap:anywhere;background:var(--a2);border-radius:12px;padding:10px 12px;margin:6px 0 8px;font-size:13.5px}
.nota{margin-top:4px}.nota summary{cursor:pointer;color:var(--a)}
.login{min-height:80vh;display:grid;place-items:center;padding:16px}.login .card{width:100%;max-width:380px}.login .brand{margin-bottom:14px}
@media(prefers-reduced-motion:no-preference){main>*{animation:up .28s ease both}}

@keyframes swr{from{opacity:0;transform:translateX(-28px)}}@keyframes swl{from{opacity:0;transform:translateX(28px)}}

<script>
const sb=supabase.createClient('https://lriuxkkcpeavmtzgwlno.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyaXV4a2tjcGVhdm10emd3bG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMjg3MTUsImV4cCI6MjExMDgwNDcxNX0.1IUTkB4oVzqRddfcGmLD09NA9rCpBmgrCbZ9u9wlHUY');
const $=document.getElementById('app'),G=i=>document.getElementById(i)?.value??'';
const R=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=v=>{let s=String(v??'').trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const P=v=>String(v??'').trim()===''?null:N(v);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={orcamento:'Orçamento',em_andamento:'Em andamento',concluida:'Concluída',cancelada:'Cancelada'};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const CATS=[['toxinas','Toxinas'],['preenchedores','Preenchedores'],['bioestimuladores','Bioestimuladores'],['biorremodeladores','Biorremodeladores'],['skinboosters','SkinBoosters'],['intradermoterapia','Intradermoterapia'],['consumo','Itens de consumo']];
const SUBS=[['canulas','Cânulas'],['agulhas_botox','Agulhas de Botox'],['descartaveis','Descartáveis']];
const catNome=c=>(CATS.find(x=>x[0]===c)||[0,c])[1];
const IC={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.4 3.5 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',dollar:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2a2.6 2 0 0 0-2.5-1.4c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2a2.7 2 0 0 1-2.5-1.4M12 6v1.8M12 16.2V18"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',ticket:'<path d="M3 8a2 2 0 0 0 0 8v2h18v-2a2 2 0 0 1 0-8V6H3z"/><path d="M13 6v12" stroke-dasharray="2 2"/>',pct:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',hourglass:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>'};
const ic=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const brand=`<div class="brand"><div class="logo">HA</div><div><div class="bn">Dr. Higor Arruda</div><div class="bs">Gestão do consultório</div></div></div>`;
let nav='home',arg=null,per=null;
let DIRTY=false,SW=null,ANIM='';
let PK={on:false,cat:'',sub:'',q:'',sel:null,pid:null},PL=[],DIA=null,CAD=[],cadQ='',cadOpen={};
async function q(p){const{data,error}=await p;if(error){alert(error.message);throw error}return data}
const go=(v,a=null)=>{nav=v;arg=a;if(v!=='home')per=null;draw()};
const run=f=>async(...a)=>{try{await f(...a)}catch(e){console.error(e)}};

async function draw(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$.innerHTML=`<div class="login"><div class="card">${brand}<label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Senha</label><input id="pw" type="password" autocomplete="current-password"><button class="b" onclick="login()">Entrar</button></div></div>`;return}
  const V={home:vHome,nova:vNova,pac:vPac,hist:vHist,edit:vEdit,cad:vCad,prod:vProd}[nav];
  let h='';try{h=await V(arg)}catch(e){console.error(e);h='<div class="card bad">Não foi possível carregar. Verifique a conexão.</div>'}
  const T=[['home','Início','home'],['nova','Nova','plus'],['pac','Pacientes','users'],['hist','Histórico','clock'],['cad','Cadastros','grid']];
  const on=k=>nav===k||(nav==='edit'&&k==='hist')||(nav==='prod'&&k==='cad');
  $.innerHTML=`<div class="shell"><aside class="side">${brand}<nav>${T.map(([k,t,i])=>`<button class="${on(k)?'on':''}" onclick="go('${k}')">${ic(i,22)}<span>${t}</span></button>`).join('')}</nav></aside><main><div class="mtop">${brand}</div>${h}</main></div>`;
  if(nav==='edit'){pkRender();diaInfo()}
  if(nav==='cad')cadRender();
  DIRTY=false;const mm=document.querySelector('main');if(mm&&ANIM)mm.classList.add('sw'+ANIM);ANIM='';
}
window.login=run(async()=>{const{error}=await sb.auth.signInWithPassword({email:G('em'),password:G('pw')});if(error)return alert('E-mail ou senha incorretos.');draw()});
window.sair=run(async()=>{await sb.auth.signOut();draw()});

/* ---------- Início (indicadores só de concluídas + bloco de orçamentos abertos) ---------- */
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let py=null,pm=null;
async function vHome(){
  const an=arg==='a',k=an?'ano':'mes';
  const[rows,abl]=await Promise.all([q(sb.from(an?'vw_dashboard_anual':'vw_dashboard_mensal').select('*').order(k,{ascending:false})),q(sb.from('vw_pipeline').select('*'))]);
  const hd=`<div class="ph"><h2>Visão geral</h2><div class="m">Indicadores apenas de precificações concluídas</div></div>`;
  const tog=`<div class="seg"><button class="${an?'':'on'}" onclick="go('home','m')">Mensal</button><button class="${an?'on':''}" onclick="go('home','a')">Anual</button></div>`;
  const pl=abl[0]||{},blk=(cl,i_,t,n,l2,v,sem)=>`<div class="card open ${cl}"><div class="oh"><div class="ki">${ic(i_)}</div><span class="tag ${cl==='and'?'ok':'warn'}">${t}</span></div><div class="grid2"><div><div class="m">Abertos</div><div class="k">${Number(n||0)}</div></div><div><div class="m">${l2}</div><div class="k">${R(v)}</div></div></div>${Number(sem)>0?`<div class="m" style="margin-top:8px">${Number(sem)} sem valor definido</div>`:''}</div>`;
  const aberto=`<div class="kg">${blk('orc','hourglass','Orçamentos',pl.orcamentos_qtd,'Valor proposto',pl.orcamentos_valor,pl.orcamentos_sem_valor)}${blk('and','clock','Em andamento',pl.andamento_qtd,'Receita prevista',pl.andamento_valor,pl.andamento_sem_valor)}</div>`;
  if(!rows.length)return`${hd}${tog}<div class="card m">Nenhuma precificação concluída ainda. Os números aparecem aqui quando você concluir a primeira.</div>${aberto}`;
  let r,sel;
  if(an){r=rows.find(x=>x[k]===per)||rows[0];sel=`<select onchange="per=this.value;draw()">${rows.map(x=>`<option value="${x[k]}" ${x[k]===r[k]?'selected':''}>${x[k].slice(0,4)}</option>`).join('')}</select>`}
  else{
    if(!py||!pm){py=rows[0].mes.slice(0,4);pm=rows[0].mes.slice(5,7)}
    const ys=[...new Set([py,...rows.map(x=>x.mes.slice(0,4))])].sort().reverse();
    r=rows.find(x=>x.mes===`${py}-${pm}-01`);
    sel=`<div class="grid2"><select onchange="pm=this.value;draw()">${MES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return`<option value="${v}" ${v===pm?'selected':''}>${n}</option>`}).join('')}</select><select onchange="py=this.value;draw()">${ys.map(y=>`<option ${y===py?'selected':''}>${y}</option>`).join('')}</select></div>`;
  }
  const c=(i,t,v,s='')=>`<div class="card"><div class="ki">${ic(i)}</div><div class="kt">${t}</div><div class="k">${v}</div>${s}</div>`;
  const body=r?`<div class="kg">${c('dollar','Faturamento',R(r.faturamento))}${c('trend','Lucro real',R(r.lucro_real),`<details class="m"><summary>detalhes</summary>Inclui ${R(r.cashback_no_lucro)} de cashback<br>Sem cashback: ${R(r.lucro_sem_cashback)}</details>`)}
  ${c('receipt','Custos totais',R(r.custos_totais))}${c('check','Concluídos',r.tratamentos_concluidos)}${c('ticket','Ticket médio',R(r.ticket_medio))}${c('pct','Margem real',Number(r.margem_real_pct||0).toFixed(1).replace('.',',')+'%')}</div>`:'<div class="card m">Nenhuma precificação concluída neste período.</div>';
  return`${hd}${tog}${sel}${body}${aberto}`;
}

/* ---------- Nova precificação ---------- */
async function vNova(){
  const ps=await q(sb.from('pacientes').select('id,nome').eq('arquivado',false).order('nome'));
  return`<div class="ph"><h2>Nova precificação</h2></div><div class="card"><label>Paciente já cadastrado</label>
  <select id="n_p"><option value="">— escolher —</option>${ps.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
  <label>ou novo paciente</label><input id="n_n" placeholder="Nome do paciente">
  <label>Procedimento</label><input id="n_pr" placeholder="Ex.: Botox"><button class="b" onclick="criar()">Criar e continuar</button></div>`;
}
window.criar=run(async()=>{
  let pid=G('n_p');const nome=G('n_n').trim(),pr=G('n_pr').trim();
  if((!pid&&!nome)||!pr)return alert('Escolha ou digite o paciente e o procedimento.');
  if(!pid)pid=(await q(sb.from('pacientes').insert({nome}).select('id').single())).id;
  go('edit',(await q(sb.from('precificacoes').insert({paciente_id:pid,procedimento:pr,status:'em_andamento'}).select('id').single())).id);
});
window.novaPara=run(async pid=>{const pr=prompt('Nome do procedimento');if(!pr)return;go('edit',(await q(sb.from('precificacoes').insert({paciente_id:pid,procedimento:pr,status:'em_andamento'}).select('id').single())).id)});

/* ---------- Pacientes ---------- */
async function vPac(id){
  if(id&&id!=='arq'){
    const[p,l]=await Promise.all([q(sb.from('pacientes').select('*').eq('id',id).single()),q(sb.from('precificacoes').select('id,procedimento,status,valor_total_cobrado,criado_em,concluida_em').eq('paciente_id',id).order('criado_em',{ascending:false}))]);
    return`<a class="l" onclick="go('pac')">← Pacientes</a><div class="ph"><h2>${esc(p.nome)}</h2><div class="m">${esc(p.telefone||'')} · cadastrado em ${new Date(p.criado_em).toLocaleDateString('pt-BR')}</div></div>
    <button class="b" onclick="novaPara('${id}')">Nova precificação</button><button class="b g" onclick="arq('pacientes','${id}',${!p.arquivado},'pac')">${p.arquivado?'Desarquivar':'Arquivar'}</button><button class="x" onclick="excPac('${id}')">Excluir definitivamente</button><div class="card"><h3>Precificações</h3>${rowsP(l)||'<span class="m">Nenhuma ainda.</span>'}</div>`;
  }
  const l=await q(sb.from('pacientes').select('id,nome,telefone').eq('arquivado',id==='arq').order('nome'));
  return`<div class="ph"><h2>Pacientes</h2></div><div class="card"><input id="p_n" placeholder="Nome"><input id="p_t" placeholder="Telefone (opcional)" inputmode="tel"><button class="b" onclick="addPac()">Cadastrar</button></div>

/* ---------- Produtos (usado no seletor da precificação e nos Cadastros) ---------- */
async function loadProds(){
  const r=await q(sb.from('produtos').select('id,nome,unidade,categoria,subcategoria,produto_precos(preco_embalagem,rendimento,vigente_desde)').eq('ativo',true).order('nome'));
  return r.map(p=>{const u=[...p.produto_precos].sort((a,b)=>b.vigente_desde.localeCompare(a.vigente_desde))[0]||null;
    return{id:p.id,nome:p.nome,un:p.unidade||'',cat:p.categoria,sub:p.subcategoria,preco:u?Number(u.preco_embalagem):null,rend:u?Number(u.rendimento):null}})
   .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true}));
}
const pkInfo=p=>p.preco==null?'sem preço':R(p.preco)+' ÷ '+p.rend+(p.un?' '+esc(p.un):'');
window.pkToggle=()=>{PK.on=!PK.on;pkRender()};
window.pkCat=c=>{PK.cat=c;PK.sub='';PK.q='';PK.sel=null;pkRender()};
window.pkSub=s=>{PK.sub=s;PK.sel=null;pkRender()};
window.pkQ=v=>{PK.q=v;pkList()};
window.pkSel=id=>{PK.sel=id;pkRender();document.getElementById('m_q')?.focus()};
function pkRender(){
  const el=document.getElementById('pk');if(!el)return;

  el.innerHTML=`<div class="m">Categoria</div><div class="chips">${CATS.map(([k,n])=>`<button class="chip ${PK.cat===k?'on':''}" onclick="pkCat('${k}')">${n}</button>`).join('')}</div>
  ${PK.cat==='consumo'?`<div class="chips">${[['','Todos'],...SUBS].map(([k,n])=>`<button class="chip sm ${PK.sub===k?'on':''}" onclick="pkSub('${k}')">${n}</button>`).join('')}</div>`:''}
  ${PK.cat?`<input id="pk_q" placeholder="Buscar em ${esc(catNome(PK.cat))}…" value="${esc(PK.q)}" oninput="pkQ(this.value)" autocomplete="off"><div id="pk_list" class="plist"></div>`:'<div class="m">Escolha uma categoria para ver os produtos.</div>'}
  ${sel?`<div class="psel"><div><b>${esc(sel.nome)}</b><div class="m">${pkInfo(sel)}</div></div><input id="m_q" placeholder="Quantidade usada${sel.un?' ('+esc(sel.un)+')':''}" inputmode="decimal"><button class="b" onclick="addMat('${PK.pid}')">Adicionar à precificação</button></div>`:''}`;
  pkList();

function pkList(){
  const el=document.getElementById('pk_list');if(!el)return;
  const t=norm(PK.q);
  const l=PL.filter(p=>p.cat===PK.cat&&(!PK.sub||p.sub===PK.sub)&&(!t||norm(p.nome).includes(t)));
  el.innerHTML=l.map(p=>`<div class="prow ${PK.sel===p.id?'on':''}" onclick="pkSel('${p.id}')"><span>${esc(p.nome)}</span><span class="m">${pkInfo(p)}</span></div>`).join('')||'<div class="m" style="padding:10px">Nenhum produto encontrado.</div>';
}

   ${(c.precos_sugeridos||[]).length?`<div class="m">Preço sugerido por forma de pagamento</div>${c.precos_sugeridos.map(x=>`<div class="row"><span>${x.forma==='pix'?'Pix':x.forma==='debito'?'Débito':x.parcelas+'x crédito'} <span class="m">taxa ${x.taxa_pct}%</span></span><b>${R(x.preco)}</b></div>`).join('')}`:'<div class="m">Informe a margem desejada para ver o preço sugerido.</div>'}
   <hr style="border:0;border-top:1px solid var(--b);margin:12px 0">
   ${f('f_tt','Valor total cobrado (cartão + Pix)',p.valor_total_cobrado)}<div class="grid2">${f('f_ca','No cartão',p.valor_cartao)}${f('f_px','No Pix',p.valor_pix)}</div>
   <div class="grid2"><div><label>Forma do cartão</label><select id="f_fm" ${dis}><option value="">—</option><option value="debito" ${p.cartao_forma==='debito'?'selected':''}>Débito</option><option value="credito" ${p.cartao_forma==='credito'?'selected':''}>Crédito</option></select></div>${f('f_pa','Parcelas',p.cartao_parcelas)}</div>

   <label>Status</label><select id="f_st" ${dis}>${['orcamento','em_andamento','cancelada'].map(k=>`<option value="${k}" ${p.status===k?'selected':''}>${ST[k]}</option>`).join('')}${L?'<option selected>Concluída</option>':''}</select>

   ${[['Materiais',c.materiais_total],['Custo operacional',c.operacional_total],['Outros custos',c.outros_custos],['Custo total',c.custo_total],['Taxa da maquininha ('+c.taxa_cartao_pct+'%)',c.taxa_cartao_valor],['Impostos',c.impostos_valor],['Líquido do cartão',c.f19_liquido_cartao]].map(([t,v])=>`<div class="row"><span>${t}</span><span>${R(v)}</span></div>`).join('')}
   <div class="row hl"><b>Lucro real</b><b class="k">${R(c.lucro_real_f22)}</b></div><div class="row"><span>Margem real</span><span>${c.margem_real_pct==null?'—':Number(c.margem_real_pct).toFixed(2).replace('.',',')+'%'}</span></div>
   ${L?`<button class="b g" onclick="reab('${id}')">Reabrir (com motivo)</button>`:p.status!=='cancelada'?`<button class="b" onclick="fin('${id}')">CONCLUIR PRECIFICAÇÃO</button>`:''}<div style="margin-top:10px"><button class="b g" onclick="arq('precificacoes','${id}',${!p.arquivada},'hist')">${p.arquivada?'Desarquivar':'Arquivar'}</button><button class="x" onclick="excPrec('${id}',${p.status==='concluida'||p.versao_vigente>0})">Excluir definitivamente</button></div></div>`;

window.arq=run(async(t,id,v,volta)=>{await q(sb.from(t).update(t==='pacientes'?{arquivado:v}:{arquivada:v}).eq('id',id));go(volta)});
const impacto=async f=>{const r=await q(f);return{n:r.length,fat:r.reduce((s,x)=>s+Number(x.valor_total_cobrado),0),luc:r.reduce((s,x)=>s+Number(x.lucro_real),0)}};
const confirmaImpacto=async(f,quem)=>{const i=await impacto(f);if(!i.n)return null;
  if(!confirm(`ATENÇÃO: excluir ${quem} remove do Início ${i.n} tratamento(s) concluído(s), ${R(i.fat)} de faturamento e ${R(i.luc)} de lucro.\n\nSe só quer tirar da lista, use ARQUIVAR (continua contando).\n\nContinuar com a exclusão?`))return false;
  if(confirm('Baixar um backup antes de excluir? (recomendado)'))await backup();
  const m=prompt('Motivo da exclusão (fica registrado):');return m||false};
window.excPrec=run(async id=>{

  if(m===false)return;if(m===null&&!confirm('Excluir esta precificação?'))return;

window.excPac=run(async id=>{

  if(m===false)return;if(m===null&&!confirm('Excluir este paciente e as precificações em aberto dele?'))return;
  await q(sb.rpc('excluir_paciente',{p_id:id,p_motivo:m}));go('pac')});
window.salvar=run(async id=>{
  await q(sb.from('precificacoes').update({status:G('f_st'),margem_desejada_pct:P(G('f_mg')),impostos_pct:N(G('f_im')),outros_custos:N(G('f_ou')),valor_total_cobrado:N(G('f_tt')),valor_cartao:N(G('f_ca')),valor_pix:N(G('f_px')),cashback:N(G('f_cb')),cartao_forma:G('f_fm')||null,cartao_parcelas:G('f_pa')?parseInt(G('f_pa')):null}).eq('id',id));go('edit',id)});
window.addMat=run(async id=>{const qt=N(G('m_q'));if(!PK.sel||!qt)return alert('Escolha o produto e a quantidade.');await q(sb.from('precificacao_materiais').insert({precificacao_id:id,produto_id:PK.sel,quantidade_usada:qt}));PK.sel=null;PK.q='';go('edit',id)});
window.delMat=run(async(m,id)=>{await q(sb.from('precificacao_materiais').delete().eq('id',m));go('edit',id)});
window.delSes=run(async(s,id)=>{if(!confirm('Remover esta sessão?'))return;await q(sb.from('sessoes').delete().eq('id',s));go('edit',id)});

/* ---------- Data da sessão: dia criado/reaproveitado por data; pacientes contados automaticamente ---------- */
const parseItens=t=>String(t||'').split('\n').map(l=>l.trim().match(/^(.*?)[\s:]+([\d.,]+)$/)).filter(Boolean).map(m=>({descricao:m[1].trim(),valor:N(m[2])}));
window.diaInfo=run(async()=>{
  const el=document.getElementById('dia_info');if(!el)return;

  if(!x){el.innerHTML=`<div class="info">Ainda não há atendimentos nesta data. Informe os custos do dia (um por linha, ex.: Aluguel 130). O custo será dividido automaticamente entre os pacientes da data.</div><textarea id="s_it" rows="3" placeholder="Aluguel 130&#10;Combustível 20"></textarea>`;return}
  const rt=await q(sb.rpc('rateio_dia',{p_dia:x.id,p_prec:PK.pid}));

  <textarea id="s_it" rows="3" disabled>${esc(x.dia_custos.map(c=>c.descricao+' '+String(c.valor).replace('.',',')).join('\n'))}</textarea>

/* ---------- Cadastros (por categoria), taxas, backup e conta ---------- */
async function vCad(){
  const[pr,tx]=await Promise.all([loadProds(),q(sb.from('taxas_cartao').select('*').order('vigente_desde',{ascending:false}))]);
  CAD=pr;
  const lt={};tx.forEach(t=>{const k=t.forma+(t.parcelas||'');if(!lt[k])lt[k]=t});
  const T=Object.values(lt).sort((a,b)=>a.forma<b.forma?1:a.forma>b.forma?-1:a.parcelas-b.parcelas);
  return`<div class="ph"><h2>Cadastros</h2></div><div class="card"><div class="sh"><h3>Produtos e materiais</h3><button class="b sm" onclick="go('prod','novo')">+ Novo</button></div>

  <div class="card"><h3>Taxas da maquininha</h3><div class="m">Alterar cria uma nova versão; precificações concluídas não mudam.</div>
  ${T.map(t=>`<div class="row"><span>${t.forma==='debito'?'Débito':t.parcelas+'x crédito'}</span><span>${t.percentual}% <a class="l" onclick="novaTaxa('${t.forma}',${t.parcelas})">alterar</a></span></div>`).join('')}</div>
  <div class="card"><h3>Conta</h3><button class="b g" onclick="backup()">Exportar backup (JSON)</button><button class="b g" onclick="sair()">Sair</button></div>`;
}
function cadRender(){
  const el=document.getElementById('cadlist');if(!el)return;
  const t=norm(cadQ);
  const row=p=>`<div class="row"><a class="l" onclick="go('prod','${p.id}')">${esc(p.nome)}</a><span class="m">${pkInfo(p)}</span></div>`;
  el.innerHTML=CATS.map(([k,n])=>{
    const all=CAD.filter(p=>p.cat===k),l=all.filter(p=>!t||norm(p.nome).includes(t));
    if(t&&!l.length)return'';
    const body=k==='consumo'
      ?SUBS.map(([sk,sn])=>{const a=l.filter(p=>p.sub===sk);return`<div class="subh"><span>${sn} <span class="m">(${a.length})</span></span><button class="x" onclick="go('prod','novo:consumo:${sk}')">+ novo</button></div>${a.map(row).join('')||'<div class="m e">Nenhum item.</div>'}`}).join('')
      :(l.map(row).join('')||'<div class="m e">Nenhum produto.</div>');
    const open=t?true:!!cadOpen[k];
    return`<details class="cat" ${open?'open':''} ontoggle="if(!cadQ)cadOpen['${k}']=this.open"><summary><span>${n}</span><span class="m">${all.length} item(ns)</span></summary>${body}<button class="b g sm" onclick="go('prod','novo:${k}')">+ Novo em ${n}</button></details>`}).join('')||'<div class="m">Nenhum produto encontrado.</div>';
}
async function vProd(id){
  const isNew=String(id).startsWith('novo'),pt=String(id).split(':');
  let p={nome:'',unidade:'',categoria:isNew?(pt[1]||''):'',subcategoria:isNew?(pt[2]||''):''},u={};
  if(!isNew){p=await q(sb.from('produtos').select('id,nome,unidade,categoria,subcategoria,produto_precos(preco_embalagem,rendimento,vigente_desde)').eq('id',id).single());u=p.produto_precos.sort((a,b)=>b.vigente_desde.localeCompare(a.vigente_desde))[0]||{}}
  return`<a class="l" onclick="go('cad')">← Cadastros</a><div class="ph"><h2>${isNew?'Novo produto':'Editar produto'}</h2></div><div class="card">

  <label>Categoria</label><select id="c_c" onchange="document.getElementById('c_sw').style.display=this.value==='consumo'?'block':'none'"><option value="">— escolher —</option>${CATS.map(([k,n])=>`<option value="${k}" ${p.categoria===k?'selected':''}>${n}</option>`).join('')}</select>
  <div id="c_sw" style="display:${p.categoria==='consumo'?'block':'none'}"><label>Subcategoria</label><select id="c_s"><option value="">— escolher —</option>${SUBS.map(([k,n])=>`<option value="${k}" ${p.subcategoria===k?'selected':''}>${n}</option>`).join('')}</select></div>
  <label>Unidade (opcional, ex.: UI, embalagem, ml)</label><input id="c_u" value="${esc(p.unidade||'')}">
  <label>Preço total pago (R$)</label><input id="c_p" value="${esc(u.preco_embalagem??'')}" inputmode="decimal">
  <label>Rendimento total (quanto rende tudo que você comprou)</label><input id="c_r" value="${esc(u.rendimento??'')}" inputmode="decimal">
  <label>Comprou mais de uma embalagem? (opcional) Uma por linha: preço / rendimento. O app soma tudo e usa no lugar dos dois campos acima.</label>
  <textarea id="c_e" rows="3" placeholder="700 / 200&#10;778 / 100"></textarea>
  <button class="b" onclick="salvaProd('${id}')">Salvar</button>${isNew?'':`<button class="b g" onclick="arqProd('${id}')">Arquivar</button><button class="x" onclick="excProd('${id}')">Excluir</button>`}
  <div class="m">Mudar preço ou rendimento vale só para as próximas precificações. As concluídas guardam os valores da época e não mudam.</div></div>`;
}
window.salvaProd=run(async id=>{
  const isNew=String(id).startsWith('novo');
  let pr=N(G('c_p')),rd=N(G('c_r'));const ln=G('c_e').split('\n').map(l=>l.split('/')).filter(a=>a.length===2&&N(a[1]));
  if(ln.length){pr=ln.reduce((s,a)=>s+N(a[0]),0);rd=ln.reduce((s,a)=>s+N(a[1]),0)}
  const n=G('c_n').trim(),cat=G('c_c'),sub=cat==='consumo'?G('c_s'):null;
  if(!n||!rd)return alert('Informe ao menos o nome e o rendimento.');
  if(!cat)return alert('Escolha a categoria.');
  if(cat==='consumo'&&!sub)return alert('Escolha a subcategoria do item de consumo.');
  const campos={nome:n,unidade:G('c_u').trim()||null,categoria:cat,subcategoria:sub};
  if(isNew)id=(await q(sb.from('produtos').insert(campos).select('id').single())).id;else await q(sb.from('produtos').update(campos).eq('id',id));
  const l=(await q(sb.from('produto_precos').select('preco_embalagem,rendimento').eq('produto_id',id).order('vigente_desde',{ascending:false}).limit(1)))[0];
  if(!l||Number(l.preco_embalagem)!==pr||Number(l.rendimento)!==rd)await q(sb.from('produto_precos').insert({produto_id:id,preco_embalagem:pr,rendimento:rd}));
  go('cad')});
window.arqProd=run(async id=>{if(!confirm('Arquivar? Ele some da lista, e as precificações antigas continuam intactas.'))return;await q(sb.from('produtos').update({ativo:false}).eq('id',id));go('cad')});
window.excProd=run(async id=>{
  if(!confirm('Excluir este produto? Se ele já foi usado em alguma precificação, será apenas arquivado para preservar o histórico.'))return;
  const r=await q(sb.rpc('excluir_produto',{p_id:id}));
  alert(r==='arquivado'?'Este produto já foi usado em precificações, então foi arquivado (sai das listas e o histórico fica preservado).':'Produto excluído.');go('cad')});
window.novaTaxa=run(async(f,pa)=>{const v=prompt('Nova taxa (%):');if(v===null||v==='')return;await q(sb.from('taxas_cartao').insert({forma:f,parcelas:pa||null,percentual:N(v)}));go('cad')});
window.backup=run(async()=>{
  const out={gerado_em:new Date().toISOString()};
  for(const t of['pacientes','dias_atendimento','dia_custos','itens_custo_nomes','produtos','produto_precos','taxas_cartao','precificacoes','precificacao_materiais','sessoes','snapshots','historico_alteracoes'])out[t]=await q(sb.from(t).select('*'));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='backup-consultorio-'+hoje()+'.json';a.click();
});

/* ---------- Gestos: arrastar para o lado volta ou troca de aba ---------- */
const TABS=['home','nova','pac','hist','cad'];
function swipe(dir){
  let alvo=null;
  const pai=nav==='edit'?'hist':nav==='prod'?'cad':(nav==='pac'&&arg)?'pac':null;
  if(pai){if(dir==='r')alvo=pai}
  else{const i=TABS.indexOf(nav),j=dir==='r'?i-1:i+1;if(i>=0&&j>=0&&j<TABS.length)alvo=TABS[j]}
  if(!alvo)return;
  if(DIRTY&&!confirm('Há alterações não salvas. Sair mesmo assim?'))return;
  ANIM=dir;go(alvo);
}
document.addEventListener('touchstart',e=>{const t=e.touches[0];SW=(e.touches.length===1&&t.clientX>16)?{x:t.clientX,y:t.clientY,el:e.target}:null},{passive:true});
document.addEventListener('touchend',e=>{
  if(!SW)return;const t=e.changedTouches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y,el=SW.el;SW=null;
  if(Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*.5)return;
  if(el&&el.closest&&el.closest('input,textarea,select,.plist'))return;
  swipe(dx>0?'r':'l')},{passive:true});
document.addEventListener('input',e=>{if(!['pk_q','cad_q'].includes(e.target.id))DIRTY=true});
sb.auth.onAuthStateChange(()=>{});draw();
</script></body></html>
