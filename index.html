window.toggleTema=b=>{const on=b.getAttribute('aria-checked')!=='true',t=on?'dark':'light';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('consultorio_tema',t)}catch(e){}b.setAttribute('aria-checked',String(on));metaTema()};
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',metaTema)}catch(e){}

/* ---------- CAPTCHA (Cloudflare Turnstile): só ativa quando config.js tem a chave pública ---------- */
const TSK=String(window.TURNSTILE_SITE_KEY||'').trim();let TSW=null,TSN=0;
const tsBox=()=>TSK?'<div id="ts" style="margin:8px 0 4px;min-height:65px"></div>':'';
function tsRender(){
  TSW=null;if(!TSK)return;const n=++TSN;
  if(!window.turnstile&&!document.getElementById('tsjs')){const s=document.createElement('script');s.id='tsjs';s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;document.head.appendChild(s)}
  const t0=Date.now(),tryRender=()=>{const el=document.getElementById('ts');if(n!==TSN||!el||Date.now()-t0>15000)return;if(window.turnstile){try{TSW=turnstile.render(el,{sitekey:TSK,theme:'auto'})}catch(e){}}else setTimeout(tryRender,200)};tryRender();
}
const tsToken=()=>{try{return TSK&&TSW!==null?(turnstile.getResponse(TSW)||''):''}catch(e){return ''}};
const tsReset=()=>{try{if(TSW!==null)turnstile.reset(TSW)}catch(e){}};

const shell=h=>{
  const T=[['home','Início','home'],['nova','Nova','plus'],['pac','Pacientes','users'],['hist','Histórico','clock'],['cad','Cadastros','grid'],['conta','Conta','user']];
  const on=k=>nav===k||(nav==='edit'&&k==='hist')||(nav==='prod'&&k==='cad');
  const tit=nav==='home';
  return`<div class="shell"><aside class="side">${brand(1,tit)}<nav>${T.map(([k,t,i])=>`<button class="${on(k)?'on':''}" onclick="tab('${k}')">${ic(i,22)}<span>${t}</span></button>`).join('')}</nav></aside><main><div class="mtop">${brand(1,tit)}</div>${h}</main></div>`;
};
/* Esqueleto: só aparece quando a tela muda e os dados demoram mais de 150 ms (telas rápidas não piscam) */
const SKL='<div class="sk sk-t"></div><div class="sk sk-c"></div><div class="sk sk-c"></div><div class="sk sk-s"></div>';
function paint(h){
  PN=nav;
  $.innerHTML=shell(h);
  if(nav==='edit'){pkRender();diaInfo();syncDescUI()}
  if(nav==='cad')cadRender();
  if(nav==='hist')selUI('h');if(nav==='pac'&&!arg)selUI('p');
  DIRTY=false;const mm=document.querySelector('main');if(mm&&ANIM)mm.classList.add('sw'+ANIM);ANIM='';
}
async function draw(swr){
  const my=++DRAWN,session=await ensure();
  if(my!==DRAWN)return;
  if(!session){
    RECOV=false;
    $.innerHTML=LM==='forgot'
     ?`<div class="login"><div class="card">${brand()}<h3>Recuperar senha</h3><div class="m">Informe seu e-mail e enviaremos um link para criar uma nova senha.</div><label>E-mail</label><input id="fg_em" type="email" autocomplete="username">${tsBox()}<button class="b" onclick="esqueci()">Enviar link</button><div style="margin-top:8px"><a class="l" onclick="LM='login';draw()">← Voltar ao login</a></div></div></div>`
     :`<div class="login"><div class="card">${brand()}<label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Senha</label><input id="pw" type="password" autocomplete="current-password">${tsBox()}<button class="b" onclick="login()">Entrar</button><div style="margin-top:8px"><a class="l" onclick="LM='forgot';draw()">Esqueci minha senha</a></div></div></div>`;
    tsRender();
    return}
  if(RECOV){
    $.innerHTML=`<div class="login"><div class="card">${brand()}<h3>Definir nova senha</h3><label>Nova senha (mínimo 8 caracteres)</label><input id="rec_n" type="password" autocomplete="new-password"><label>Confirmar nova senha</label><input id="rec_c" type="password" autocomplete="new-password"><button class="b" onclick="novaSenhaRec()">Salvar nova senha</button><div style="margin-top:8px"><a class="l" onclick="sair()">Cancelar</a></div></div></div>`;
    return}
  const V={home:vHome,nova:vNova,pac:vPac,hist:vHist,edit:vEdit,cad:vCad,prod:vProd,conta:vConta}[nav];
  const k=[nav,arg,per,py,pm,cadQ].join('|'),cacheable=['home','pac','hist','cad'].includes(nav);
  let shown=null;
  if(swr&&cacheable&&VC[k]!=null){shown=VC[k];paint(shown)}
  let skT=null;
  if(shown===null&&PN!==nav)skT=setTimeout(()=>{if(my===DRAWN)$.innerHTML=shell(SKL)},150);
  let h='';try{h=await V(arg)}catch(e){console.error(e);h='<div class="card bad">Não foi possível carregar. Verifique a conexão.</div>'}
  clearTimeout(skT);
  if(my!==DRAWN)return;
  if(cacheable)VC[k]=h;
  if(h!==shown)paint(h);
}
window.login=run(async()=>{
  const cap=tsToken();if(TSK&&!cap)return alert('Confirme a verificação de segurança antes de entrar.');
  const{data,error}=await sb.auth.signInWithPassword({email:G('em').trim(),password:G('pw'),options:cap?{captchaToken:cap}:undefined});
  if(error){tsReset();const m=error.message||'';return alert(/captcha/i.test(m)?'A verificação de segurança falhou. Tente de novo.':(error.status===429||/rate limit|bloquead|tentativas/i.test(m))?'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.':'E-mail ou senha incorretos.')}
  SESS=data.session;VC={};touch();draw()});
window.sair=run(async()=>{await sb.auth.signOut();SESS=null;VC={};RECOV=false;LM='login';draw()});
window.esqueci=run(async()=>{
  const e=G('fg_em').trim();if(!e)return alert('Informe seu e-mail.');
  const cap=tsToken();if(TSK&&!cap)return alert('Confirme a verificação de segurança antes de enviar.');
  const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname,captchaToken:cap||undefined});
  if(error&&/captcha/i.test(error.message||'')){tsReset();return alert('A verificação de segurança falhou. Tente de novo.')}
  if(error&&/rate|limit|seconds/i.test(error.message||'')){tsReset();return alert('Muitas solicitações em pouco tempo. Aguarde alguns minutos e tente de novo.')}
  alert('Se este e-mail estiver cadastrado, você receberá um link para criar uma nova senha. Confira também o spam.');LM='login';draw()});
const senhaOk=(a,b)=>{if(a.length<8){alert('A senha precisa ter pelo menos 8 caracteres.');return false}if(a!==b){alert('As senhas não coincidem.');return false}return true};
window.novaSenhaRec=run(async()=>{
  if(!senhaOk(G('rec_n'),G('rec_c')))return;
  const{error}=await sb.auth.updateUser({password:G('rec_n')});
  if(error)return alert(error.message);
  RECOV=false;history.replaceState(null,'',location.pathname);alert('Senha alterada. Você já está conectado.');nav='home';arg=null;VC={};draw()});
window.trocaSenha=run(async()=>{
  if(!G('cp_a'))return alert('Informe sua senha atual.');
  if(!senhaOk(G('cp_n'),G('cp_c')))return;
  const{error}=await sb.auth.updateUser({password:G('cp_n'),current_password:G('cp_a')});
  if(error)return alert(/current.?password|invalid login|incorrect/i.test(error.message||'')?'Senha atual incorreta.':error.message);
  ['cp_a','cp_n','cp_c'].forEach(i=>{const e=document.getElementById(i);if(e)e.value=''});alert('Senha alterada com sucesso.')});

/* ---------- Início (indicadores só de concluídas + blocos por status) ---------- */
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let py=null,pm=null;
async function vHome(){
  const an=arg==='a',k=an?'ano':'mes';
  /* No modo mensal a mesma view alimenta os cards e os gráficos: pedida uma vez só */
  const rp=q(sb.from(an?'vw_dashboard_anual':'vw_dashboard_mensal').select('*').order(k,{ascending:false}));
  const[rows,abl,gfd]=await Promise.all([rp,q(sb.from('vw_pipeline').select('*')),gfLoad(an?null:rp)]);
  const hd=`<div class="ph"><h2>Visão geral</h2><div class="m">Indicadores apenas de precificações concluídas</div></div>`;
  const tog=`<div class="seg"><button class="${an?'':'on'}" onclick="go('home','m')">Mensal</button><button class="${an?'on':''}" onclick="go('home','a')">Anual</button></div>`;
  const pl=abl[0]||{},blk=(cl,i_,t,n,l2,v,sem)=>`<div class="card open ${cl}"><div class="oh"><div class="ki">${ic(i_)}</div><span class="tag ${cl==='and'?'ok':'warn'}">${t}</span></div><div class="grid2"><div><div class="m">Abertos</div><div class="k">${Number(n||0)}</div></div><div><div class="m">${l2}</div><div class="k">${R(v)}</div></div></div>${Number(sem)>0?`<div class="m" style="margin-top:8px">${Number(sem)} sem valor definido</div>`:''}</div>`;
  const aberto=`<div class="kg pipe">${blk('orc','hourglass','Orçamentos',pl.orcamentos_qtd,'Valor proposto',pl.orcamentos_valor,pl.orcamentos_sem_valor)}${blk('and','clock','Em andamento',pl.andamento_qtd,'Receita prevista',pl.andamento_valor,pl.andamento_sem_valor)}</div>`;
  const graf=gfSection(gfd);
  if(!rows.length)return`${hd}${tog}<div class="card m">Nenhuma precificação concluída ainda. Os números aparecem aqui quando você concluir a primeira.</div>${aberto}${graf}`;
  let r,sel;
  if(an){r=rows.find(x=>x[k]===per)||rows[0];sel=`<select onchange="per=this.value;draw()">${rows.map(x=>`<option value="${x[k]}" ${x[k]===r[k]?'selected':''}>${x[k].slice(0,4)}</option>`).join('')}</select>`}
  else{
    if(!py||!pm){py=rows[0].mes.slice(0,4);pm=rows[0].mes.slice(5,7)}
    const ys=[...new Set([py,...rows.map(x=>x.mes.slice(0,4))])].sort().reverse();
    r=rows.find(x=>x.mes===`${py}-${pm}-01`);
    sel=`<div class="grid2"><select onchange="pm=this.value;draw()">${MES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return`<option value="${v}" ${v===pm?'selected':''}>${n}</option>`}).join('')}</select><select onchange="py=this.value;draw()">${ys.map(y=>`<option ${y===py?'selected':''}>${y}</option>`).join('')}</select></div>`;
  }
  const c=(i,t,v,s='')=>`<div class="card"><div class="ki">${ic(i)}</div><div class="kt">${t}</div><div class="k">${v}</div>${s}</div>`;
  const body=r?`<div class="kg">${c('dollar','Faturamento',R(r.faturamento))}${c('trend','Lucro real',R(r.lucro_real),`<details class="m"><summary>detalhes</summary>Inclui ${R(r.cashback_no_lucro)} de cashback<br>Sem cashback: ${R(r.lucro_sem_cashback)}</details>`)}
  ${c('receipt','Custos totais',R(r.custos_totais))}${c('check','Concluídos',r.tratamentos_concluidos)}${c('ticket','Ticket médio',R(r.ticket_medio))}${c('pct','Margem real',Number(r.margem_real_pct||0).toFixed(1).replace('.',',')+'%')}</div>`:'<div class="card m">Nenhuma precificação concluída neste período.</div>';
  return`${hd}${tog}${sel}${body}${aberto}${graf}`;
}

/* ---------- Nova precificação (o procedimento vem da lista gerenciada em Cadastros) ---------- */

  <select id="n_p"><option value="">— escolher —</option>${ps.map(p=>`<option value="${p.id}" ${p.id===pre?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>

window.criar=run(async()=>{

window.novaPara=pid=>go('nova',pid);

/* ---------- Seleção e exclusão (individual e em lote) ---------- */
window.selTog=(k,id,on)=>{on?SEL[k].add(id):SEL[k].delete(id);selUI(k)};
window.selAll=(k,on)=>{SEL[k]=new Set(on?VIS[k]:[]);document.querySelectorAll('input.sel[data-k="'+k+'"]').forEach(c=>c.checked=on);selUI(k)};
function selUI(k){const n=SEL[k].size,b=document.getElementById('selbtn'),a=document.getElementById('selall');if(b){b.hidden=!n;b.textContent='Excluir selecionados ('+n+')'}if(a)a.checked=n>0&&n===VIS[k].length}
const bar=k=>`<div class="bar"><label class="ck"><input type="checkbox" id="selall" onchange="selAll('${k}',this.checked)"> Selecionar todos</label><button id="selbtn" class="b sm bd" onclick="excluir('${k}',[...SEL.${k}])" hidden>Excluir selecionados</button></div>`;
const ckx=(k,id)=>`<label class="ck" title="Selecionar"><input type="checkbox" class="sel" data-k="${k}" ${SEL[k].has(id)?'checked':''} onchange="selTog('${k}','${id}',this.checked)"></label>`;
const xbtn=(k,id)=>`<button class="xx" title="Excluir" aria-label="Excluir" onclick="excluir('${k}',['${id}'])">✕</button>`;
function caixa({titulo,html,ok='Excluir',motivo=false}){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='ov';
    o.innerHTML=`<div class="md" role="dialog" aria-modal="true"><h3>${titulo}</h3><div class="mb">${html}</div>${motivo?'<label>Motivo da exclusão (fica registrado)</label><input id="cx_m" autocomplete="off">':''}<label class="bk"><input type="checkbox" id="cx_b"> Baixar um backup antes de excluir</label><div class="ma"><button class="b g" id="cx_c">Cancelar</button><button class="b bd" id="cx_o">${ok}</button></div></div>`;
    document.body.appendChild(o);
    const fim=v=>{o.remove();document.removeEventListener('keydown',onEsc);res(v)};
    const onEsc=e=>{if(e.key==='Escape')fim(null)};
    document.addEventListener('keydown',onEsc);
    o.querySelector('#cx_c').onclick=()=>fim(null);
    o.addEventListener('click',e=>{if(e.target===o)fim(null)});
    o.querySelector('#cx_o').onclick=()=>{const m=(o.querySelector('#cx_m')?.value||'').trim();if(motivo&&!m){alert('Informe o motivo da exclusão.');return}fim({motivo:m,backup:o.querySelector('#cx_b').checked})};
    o.querySelector('#cx_c').focus();
  });
}
const resumoP=l=>{const c={};l.forEach(x=>c[x.status]=(c[x.status]||0)+1);return Object.entries(c).map(([s,n])=>n+' '+(ST[s]||s).toLowerCase()).join(', ')};
/* k='h' exclui precificações; k='p' exclui pacientes (e as precificações vinculadas). volta=[tela,arg] opcional */
window.excluir=run(async(k,ids,volta)=>{
  if(!ids||!ids.length)return;
  const col=k==='h'?'id':'paciente_id';
  const precs=await q(sb.from('precificacoes').select('id,procedimento,status,versao_vigente,paciente_id,pacientes(nome)').in(col,ids));
  const conc=precs.filter(x=>x.status==='concluida'||x.versao_vigente>0);
  let imp={n:0,fat:0,luc:0};
  if(precs.length){const v=await q(sb.from('vw_concluidas').select('valor_total_cobrado,lucro_real').in('precificacao_id',precs.map(x=>x.id)));imp={n:v.length,fat:v.reduce((s,x)=>s+Number(x.valor_total_cobrado),0),luc:v.reduce((s,x)=>s+Number(x.lucro_real),0)}}
  let lista;
  if(k==='p'){
    const ps=await q(sb.from('pacientes').select('id,nome').in('id',ids));
    lista=ps.map(p=>{const m=precs.filter(x=>x.paciente_id===p.id);return`<li><b>${esc(p.nome)}</b> — ${m.length?m.length+' precificação(ões) vinculada(s) serão excluídas junto ('+resumoP(m)+')':'sem precificações vinculadas'}</li>`}).join('');
  }else lista=precs.map(x=>`<li>${esc(x.pacientes?.nome||'')} · ${esc(x.procedimento)} <span class="m">(${ST[x.status]})</span></li>`).join('');
  const total=k==='h'?ids.length:ids.length;
  let html=`<div>${k==='h'?'Serão excluídas':'Serão excluídos'} <b>${total}</b> ${k==='h'?'precificação(ões)':'paciente(s)'}:</div><ul>${lista}</ul>`;
  if(k==='p'&&precs.length)html+=`<div class="info">Total de <b>${precs.length}</b> precificação(ões) vinculada(s) serão apagadas junto, com suas sessões e materiais.</div>`;
  else if(precs.length)html+=`<div class="m">As sessões e materiais ligados serão apagados. Se o custo do dia era dividido com outras precificações em aberto, ele é redistribuído entre elas.</div>`;
  if(imp.n)html+=`<div class="alerta">Atenção: isso remove do Início <b>${imp.n}</b> tratamento(s) concluído(s), <b>${R(imp.fat)}</b> de faturamento e <b>${R(imp.luc)}</b> de lucro. Se só quer tirar da lista, use ARQUIVAR (continua contando).</div>`;
  html+=`<div class="m">Esta ação não pode ser desfeita.</div>`;
  const r=await caixa({titulo:'Confirmar exclusão',html,ok:'Excluir definitivamente',motivo:conc.length>0});
  if(!r)return;
  if(r.backup)await backup();
  await q(sb.rpc(k==='h'?'excluir_precificacoes_lote':'excluir_pacientes_lote',{p_ids:ids,p_motivo:r.motivo||null}));
  SEL[k].clear();
  if(volta)go(volta[0],volta[1]);else go(nav,arg);
});

/* ---------- Pacientes ---------- */
let PACL=[];
function pacLista(){
  const t=norm(PQ.trim()),l=PACL.filter(p=>!t||norm(p.nome).includes(t));
  VIS.p=l.map(p=>p.id);SEL.p=new Set([...SEL.p].filter(i=>VIS.p.includes(i)));
  return(l.length?bar('p'):'')+(l.map(p=>`<div class="row">${ckx('p',p.id)}<span class="grow"><a class="l" onclick="go('pac','${p.id}')">${esc(p.nome)}</a></span><span class="m">${esc(p.telefone||'')}</span>${xbtn('p',p.id)}</div>`).join('')||`<span class="m">${t?'Nenhum paciente encontrado para esta busca.':'Nenhum paciente.'}</span>`);
}
window.pQ=v=>{PQ=v;const e=document.getElementById('pac_list');if(e){e.innerHTML=pacLista();selUI('p')}};
async function vPac(id){

    <button class="b" onclick="novaPara('${id}')">Nova precificação</button><button class="b g" onclick="arq('pacientes','${id}',${!p.arquivado},'pac')">${p.arquivado?'Desarquivar':'Arquivar'}</button><button class="x" onclick="excluir('p',['${id}'],['pac',null])">Excluir definitivamente</button><div class="card"><h3>Precificações</h3>${rowsP(l)||'<span class="m">Nenhuma ainda.</span>'}</div>`;
  }
  PACL=await q(sb.from('pacientes').select('id,nome,telefone').eq('arquivado',id==='arq').order('nome'));
  return`<div class="ph"><h2>Pacientes</h2></div><div class="card"><input id="p_n" placeholder="Nome"><input id="p_t" placeholder="Telefone (opcional)" inputmode="tel"><button class="b" onclick="addPac()">Cadastrar</button></div>
  <input id="p_q" type="search" placeholder="Buscar paciente..." value="${esc(PQ)}" oninput="pQ(this.value)" autocomplete="off" aria-label="Buscar paciente">
  <div class="card" id="pac_list">${pacLista()}</div><a class="l" onclick="go('pac',${id==='arq'?'null':"'arq'"})">${id==='arq'?'← Pacientes ativos':'Ver arquivados'}</a>`;
}
window.pacEditNome=()=>{document.getElementById('pn_view').hidden=true;document.getElementById('pn_edit').hidden=false;const i=document.getElementById('pn_n');i.focus();i.select()};
window.pacCancelarNome=()=>{const i=document.getElementById('pn_n');i.value=i.dataset.o||'';document.getElementById('pn_edit').hidden=true;document.getElementById('pn_view').hidden=false;DIRTY=false};
window.pacSalvarNome=run(async id=>{
  const n=G('pn_n').trim().replace(/\s+/g,' ');

window.addPac=run(async()=>{if(!G('p_n').trim())return;await q(sb.from('pacientes').insert({nome:G('p_n').trim(),telefone:G('p_t').trim()||null}));go('pac')});
const dt=x=>new Date(x).toLocaleDateString('pt-BR');

/* ---------- Histórico (busca por paciente integrada aos filtros de status) ---------- */
/* HPN (lista de pacientes para a busca) só é pedida quando a pessoa realmente busca; HLIM = quantas linhas a lista mostra */
let HPN=null,HT=null,HS=0;const HLIM=100;
async function histDados(f){
  const t=norm(HQ.trim());let ids=null;
  if(t){if(!HPN)HPN=await q(sb.from('pacientes').select('id,nome'));ids=HPN.filter(p=>norm(p.nome).includes(t)).map(p=>p.id);if(!ids.length)return[]}
  let s=sb.from('precificacoes').select('id,procedimento,status,valor_total_cobrado,criado_em,concluida_em,pacientes(nome)').order('criado_em',{ascending:false}).limit(HLIM);
  if(ids)s=s.in('paciente_id',ids);
  s=f==='arq'?s.eq('arquivada',true):(f?s.eq('status',f):s).eq('arquivada',false);
  return q(s);
}
function histLista(l){
  VIS.h=l.map(x=>x.id);SEL.h=new Set([...SEL.h].filter(i=>VIS.h.includes(i)));
  return(l.length?bar('h'):'')+(rowsP(l,'h')||`<span class="m">${HQ.trim()?'Nenhuma precificação encontrada para esta busca.':'Nada por aqui.'}</span>`)+(l.length>=HLIM?`<div class="m" style="margin-top:8px">Mostrando as ${HLIM} mais recentes. Use a busca para localizar as demais.</div>`:'');
}
window.hQ=v=>{HQ=v;clearTimeout(HT);HT=setTimeout(async()=>{
  const my=++HS,f=arg;
  try{const l=await histDados(f);if(my!==HS||nav!=='hist')return;const e=document.getElementById('hist_list');if(e){e.innerHTML=histLista(l);selUI('h')}}catch(e){}
},200)};
async function vHist(f){
  HPN=null;
  const l=await histDados(f);
  return`<div class="ph"><h2>Histórico de precificações</h2></div><div class="hfil"><select onchange="go('hist',this.value||null)"><option value="">Todas</option>${Object.entries(ST).map(([k,t])=>`<option value="${k}" ${f===k?'selected':''}>${t}</option>`).join('')}<option value="arq" ${f==='arq'?'selected':''}>Arquivadas</option></select>
  <input id="h_q" type="search" placeholder="Buscar precificação..." value="${esc(HQ)}" oninput="hQ(this.value)" autocomplete="off" aria-label="Buscar precificação pelo nome do paciente"></div>
  <div class="card" id="hist_list">${histLista(l)}</div>`;
}

/* ---------- Produtos (usado no seletor da precificação e nos Cadastros) ---------- */
async function loadProds(force){
  if(!force&&PC&&Date.now()-PC.t<300000)return PC.list;
  const r=await q(sb.from('produtos').select('id,nome,unidade,categoria,subcategoria,produto_precos(preco_embalagem,rendimento,vigente_desde)').eq('ativo',true).order('nome'));
  const list=r.map(p=>{const u=[...p.produto_precos].sort((a,b)=>b.vigente_desde.localeCompare(a.vigente_desde))[0]||null;
    return{id:p.id,nome:p.nome,un:p.unidade||'',cat:p.categoria,preco:u?Number(u.preco_embalagem):null,rend:u?Number(u.rendimento):null}})
   .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true}));
  PC={list,t:Date.now()};return list;
}
const pkInfo=p=>p.preco==null?'sem preço':R(p.preco)+' ÷ '+p.rend+(p.un?' '+esc(p.un):'');
window.pkToggle=async()=>{PK.on=!PK.on;if(PK.on&&!PL.length){try{PL=await loadProds()}catch(e){PK.on=false}}pkRender()};
window.pkCat=c=>{PK.cat=c;PK.q='';PK.sel=null;pkRender()};
window.pkQ=v=>{PK.q=v;pkList()};
window.pkSel=id=>{PK.sel=id;pkRender();document.getElementById('m_q')?.focus()};
function pkRender(){
  const el=document.getElementById('pk');if(!el)return;
  el.hidden=!PK.on;if(!PK.on)return;
  const sel=PL.find(p=>p.id===PK.sel);
  el.innerHTML=`<div class="m">Categoria</div><div class="chips">${CATS.map(([k,n])=>`<button class="chip ${PK.cat===k?'on':''}" onclick="pkCat('${k}')">${n}</button>`).join('')}</div>
  ${PK.cat?`<input id="pk_q" placeholder="Buscar em ${esc(catNome(PK.cat))}…" value="${esc(PK.q)}" oninput="pkQ(this.value)" autocomplete="off"><div id="pk_list" class="plist"></div>`:'<div class="m">Escolha uma categoria para ver os produtos.</div>'}
  ${sel?`<div class="psel"><div><b>${esc(sel.nome)}</b><div class="m">${pkInfo(sel)}</div></div><input id="m_q" placeholder="Quantidade usada${sel.un?' ('+esc(sel.un)+')':''}" inputmode="decimal" autocomplete="off"><button class="b" onclick="addMat('${PK.pid}')">Adicionar à precificação</button></div>`:''}`;
  pkList();
}
function pkList(){
  const el=document.getElementById('pk_list');if(!el)return;
  const t=norm(PK.q);
  const l=PL.filter(p=>p.cat===PK.cat&&(!t||norm(p.nome).includes(t)));
  el.innerHTML=l.map(p=>`<div class="prow ${PK.sel===p.id?'on':''}" onclick="pkSel('${p.id}')"><span>${esc(p.nome)}</span><span class="m">${pkInfo(p)}</span></div>`).join('')||'<div class="m" style="padding:10px">Nenhum produto encontrado.</div>';
}

/* ---------- Editor da precificação ---------- */
const sugHtml=c=>(c.precos_sugeridos||[]).length?`<div class="m">Preço sugerido por forma de pagamento</div>${c.precos_sugeridos.map(x=>`<div class="row"><span>${x.forma==='pix'?'Pix':x.forma==='debito'?'Débito':x.parcelas+'x crédito'} <span class="m">taxa ${x.taxa_pct}%</span></span><b>${R(x.preco)}</b></div>`).join('')}`:'<div class="m">Informe a margem desejada para ver o preço sugerido.</div>';
const difHtml=c=>Math.abs(c.diferenca_alocacao)>0.005?`<div class="bad">Cartão + Pix não fecham com o valor final cobrado (diferença ${R(c.diferenca_alocacao)}).</div>`:'';
const finHtml=c=>`Valor final após desconto: <b>${R(c.valor_cobrado_final)}</b> · Cartão + Pix devem somar esse valor.`;
const alertaMargem=c=>(c.margem_real_pct!=null&&Number(c.margem_real_pct)<20)?`<div class="alerta" role="alert">Atenção: esta precificação apresenta margem real inferior a 20%. Verifique os custos e o valor cobrado antes de finalizar.</div>`:'';
const resHtml=c=>[['Materiais',c.materiais_total],['Custo operacional',c.operacional_total],['Outros custos',c.outros_custos],['Custo total',c.custo_total],['Taxa da maquininha ('+c.taxa_cartao_pct+'%)',c.taxa_cartao_valor],['Impostos',c.impostos_valor],['Líquido do cartão',c.f19_liquido_cartao]].map(([t,v])=>`<div class="row"><span>${t}</span><span>${R(v)}</span></div>`).join('')
 +`<div class="row hl"><b>Lucro real</b><b class="k">${R(c.lucro_real_f22)}</b></div><div class="row"><span>Margem real</span><span>${c.margem_real_pct==null?'—':Number(c.margem_real_pct).toFixed(2).replace('.',',')+'%'}</span></div>${alertaMargem(c)}`;
/* Exceção de rateio por sessão: quantidade total de pacientes (inclui quem não está cadastrado). Só altera o denominador desta sessão. */
const rxHtml=(s,x,L)=>{
  const n=s.pacientes_rateio,on=!!s.rateio_externo;
  if(L)return on&&n?`<div class="m">Rateio com pacientes não cadastrados: ${n} paciente(s) informado(s)</div>`:'';
  return`<label class="ck rx"><input type="checkbox" ${on?'checked':''} onchange="rqTog('${s.id}',this.checked)"><span>Esta sessão possui rateio com pacientes não cadastrados?</span></label>`
   +(on?`<div class="m">Quantidade de pacientes usada no cálculo: <b>${x.pacientes??n??'—'}</b>${n&&x.pacientes&&x.pacientes!==n?` (informado: ${n})`:''}</div>
   ${n?`<button class="b g sm" onclick="rqEdit('${s.id}')">Editar quantidade de pacientes</button>`:''}
   <div class="rqe" id="rqe_${s.id}" ${n?'hidden':''}><input id="rq_${s.id}" value="${n||''}" data-o="${n||''}" inputmode="numeric" placeholder="Total de pacientes no rateio" autocomplete="off"><button class="b sm" onclick="rqSave('${s.id}')">Salvar</button>${n?`<button class="b g sm" onclick="rqCancel('${s.id}')">Cancelar</button>`:''}</div>
   ${n?'':'<div class="alerta">Informe a quantidade de pacientes para poder concluir.</div>'}`:'');
};
const qtdOk=v=>/^[1-9]\d{0,5}$/.test(String(v).trim());
window.rqTog=run(async(sid,on)=>{await q(sb.rpc('definir_rateio_sessao',{p_sessao:sid,p_ativo:on,p_qtd:null}));go('edit',arg)});
window.rqEdit=sid=>{const e=document.getElementById('rqe_'+sid);if(!e)return;e.hidden=false;const i=document.getElementById('rq_'+sid);i.focus();i.select()};
window.rqCancel=sid=>{const i=document.getElementById('rq_'+sid);if(i)i.value=i.dataset.o||'';const e=document.getElementById('rqe_'+sid);if(e)e.hidden=true};

window.rxForm=()=>{const b=document.getElementById('s_rxb'),c=document.getElementById('s_rx');if(b&&c)b.hidden=!c.checked};

  <div class="card"><h3>1. Materiais (total do tratamento)</h3>
   ${ms.map(m=>`<div class="row"><span>${esc(m.nome)} <span class="m">× ${m.quantidade_usada}</span></span><span class="r">${R(m.preco_embalagem/m.rendimento*m.quantidade_usada)} ${L?'':`<button class="x" onclick="delMat('${m.id}','${id}')">✕</button>`}</span></div>`).join('')||'<span class="m">Nenhum material.</span>'}

/* ---------- Desconto: valor e percentual são o MESMO desconto (um atualiza o outro; nunca somam) ---------- */
const setv=(i,v)=>{const e=document.getElementById(i);if(e)e.value=v};
let DM=null;const dmsg=t=>{const e=document.getElementById('dmsg');if(!e)return;e.textContent=t;clearTimeout(DM);DM=setTimeout(()=>{const x=document.getElementById('dmsg');if(x)x.textContent=''},3500)};
window.descV=()=>{DL='v';const o=r2(N(G('f_tt')));let v=N(G('f_dv'));
  if(v>o){v=o;setv('f_dv',mon(v));dmsg(o>0?'O desconto não pode ser maior que o valor original.':'Informe primeiro o valor total cobrado.')}
  setv('f_dp',pctv(o>0?v/o*100:0));syncDescUI()};
window.descP=()=>{DL='p';const o=r2(N(G('f_tt')));let p=N(G('f_dp'));
  if(p>100){p=100;setv('f_dp','100');dmsg('O desconto não pode passar de 100%.')}
  if(o<=0&&p>0){p=0;setv('f_dp','');dmsg('Informe primeiro o valor total cobrado.')}
  setv('f_dv',mon(r2(o*p/100)));syncDescUI()};
window.descT=()=>{const o=r2(N(G('f_tt')));
  if(DL==='p'){setv('f_dv',mon(r2(o*Math.min(N(G('f_dp')),100)/100)))}
  else{let v=N(G('f_dv'));if(v>o){v=o;setv('f_dv',mon(v));dmsg('O desconto foi ajustado ao novo valor original.')}setv('f_dp',pctv(o>0?v/o*100:0))}
  syncDescUI()};
window.rmDesc=()=>{DL='v';setv('f_dv','');setv('f_dp','');setv('f_dj','');syncDescUI();liveSched()};
function syncDescUI(){const t=N(G('f_dv'))>0;const a=document.getElementById('dj'),b=document.getElementById('rmd'),c=document.getElementById('fin');
  if(a)a.hidden=!t;if(b)b.hidden=!t;if(c)c.hidden=!t}

/* ---------- Cálculo em tempo real (nada é gravado até clicar em Salvar) ---------- */
let LSEQ=0,LT=null;
const over=()=>{const o=r2(N(G('f_tt')));return{margem_desejada_pct:P(G('f_mg')),impostos_pct:N(G('f_im')),outros_custos:N(G('f_ou')),valor_original:o,desconto_valor:Math.min(r2(N(G('f_dv'))),o),valor_cartao:N(G('f_ca')),valor_pix:N(G('f_px')),cashback:N(G('f_cb')),cartao_forma:G('f_fm')||null,cartao_parcelas:G('f_pa')?parseInt(G('f_pa')):null}};
function liveSched(){clearTimeout(LT);LT=setTimeout(liveCalc,300)}
async function liveCalc(){
  const t=document.getElementById('f_tt');if(nav!=='edit'||!t||t.disabled)return;
  const my=++LSEQ,id=arg;
  try{const{data,error}=await sb.rpc('calcular_precificacao',{p_id:id,p_over:over()});
    if(error||my!==LSEQ||nav!=='edit'||arg!==id)return;
    const s=(i,h)=>{const e=document.getElementById(i);if(e)e.innerHTML=h};
    s('sug',sugHtml(data));s('dif',difHtml(data));s('resv',resHtml(data));s('fin',finHtml(data));
  }catch(e){}
}

window.arq=run(async(t,id,v,volta)=>{await q(sb.from(t).update(t==='pacientes'?{arquivado:v}:{arquivada:v}).eq('id',id));go(volta)});
window.salvar=run(async id=>{
  const o=r2(N(G('f_tt'))),dv=r2(N(G('f_dv')));
  if(dv>o)return alert('O desconto não pode ser maior que o valor original.');
  const d=Math.min(dv,o);
  await q(sb.from('precificacoes').update({status:G('f_st'),margem_desejada_pct:P(G('f_mg')),impostos_pct:N(G('f_im')),outros_custos:N(G('f_ou')),
    valor_original:o,desconto_valor:d,desconto_pct:o>0?Math.min(100,r4(d/o*100)):0,desconto_justificativa:d>0?(G('f_dj').trim()||null):null,valor_total_cobrado:r2(o-d),
    valor_cartao:N(G('f_ca')),valor_pix:N(G('f_px')),cashback:N(G('f_cb')),cartao_forma:G('f_fm')||null,cartao_parcelas:G('f_pa')?parseInt(G('f_pa')):null}).eq('id',id));go('edit',id)});
window.addMat=run(async id=>{const qt=N(G('m_q'));if(!PK.sel||!qt)return alert('Escolha o produto e a quantidade.');await q(sb.from('precificacao_materiais').insert({precificacao_id:id,produto_id:PK.sel,quantidade_usada:qt}));PK.sel=null;PK.q='';go('edit',id)});
window.delMat=run(async(m,id)=>{await q(sb.from('precificacao_materiais').delete().eq('id',m));go('edit',id)});
window.delSes=run(async(s,id)=>{if(!confirm('Remover esta sessão?'))return;await q(sb.from('sessoes').delete().eq('id',s));go('edit',id)});

/* ---------- Data da sessão: dia criado/reaproveitado por data; pacientes contados automaticamente ---------- */
const parseItens=t=>String(t||'').split('\n').map(l=>l.trim().match(/^(.*?)[\s:]+([\d.,]+)$/)).filter(Boolean).map(m=>({descricao:m[1].trim(),valor:N(m[2])}));
window.diaInfo=run(async()=>{
  const el=document.getElementById('dia_info');if(!el)return;
  const d=G('s_data');if(!d){el.innerHTML='';DIA=null;return}
  const x=await q(sb.from('dias_atendimento').select('id,dia_custos(descricao,valor)').eq('data',d).maybeSingle());
  DIA=x?x.id:null;
  if(!x){el.innerHTML=`<div class="info">Ainda não há atendimentos nesta data. Informe os custos do dia (um por linha, ex.: Aluguel 130). O custo será dividido automaticamente entre os pacientes da data.</div><textarea id="s_it" rows="3" placeholder="Aluguel 130&#10;Combustível 20"></textarea>`;return}
  const rt=await q(sb.rpc('rateio_dia',{p_dia:x.id,p_prec:PK.pid}));
  const tot=x.dia_custos.reduce((s,c)=>s+Number(c.valor),0);
  el.innerHTML=`<div class="info">Nesta data: <b>${rt.concluidas}</b> concluída(s) · <b>${rt.abertas}</b> em aberto · custo do dia <b>${R(tot)}</b>. Ao adicionar, esta precificação entra no rateio automaticamente.</div>
  <textarea id="s_it" rows="3" disabled>${esc(x.dia_custos.map(c=>c.descricao+' '+String(c.valor).replace('.',',')).join('\n'))}</textarea>
  <button id="b_ed" class="b g sm" onclick="edCustos()">Editar custos do dia</button><button id="b_sv" class="b sm" style="display:none" onclick="svCustos('${PK.pid}')">Salvar custos do dia</button>`;
});
window.edCustos=()=>{const t=document.getElementById('s_it');t.disabled=false;t.focus();document.getElementById('b_ed').style.display='none';document.getElementById('b_sv').style.display='inline-block'};
window.svCustos=run(async id=>{
  const it=parseItens(G('s_it'));if(!DIA||!it.length)return alert('Informe ao menos um item de custo (ex.: Aluguel 130).');
  if(!confirm('Alterar os custos deste dia? O novo valor passa a valer só para precificações em aberto; as concluídas continuam como estão.'))return;
  await q(sb.rpc('definir_custos_dia',{p_dia:DIA,p_itens:it}));go('edit',id)});
window.addSes=run(async id=>{
  const d=G('s_data');if(!d)return alert('Escolha a data da sessão.');
  const rx=!!document.getElementById('s_rx')?.checked,rq=G('s_rq').trim();
  if(rx&&!qtdOk(rq))return alert('Informe a quantidade total de pacientes do rateio (número inteiro maior que zero).');
  await q(sb.rpc('adicionar_sessao',{p_prec:id,p_data:d,p_status:G('s_st'),p_contar:document.getElementById('s_ct').checked,p_itens:parseItens(G('s_it')),p_rateio_externo:rx,p_pacientes_rateio:rx?parseInt(rq,10):null}));go('edit',id)});
window.fin=run(async id=>{if(!confirm('Concluir? A precificação fica bloqueada e entra no Início. Só reabre com motivo.'))return;await q(sb.rpc('concluir_precificacao',{p_id:id}));go('edit',id)});
window.reab=run(async id=>{const m=prompt('Motivo da reabertura:');if(!m)return;await q(sb.rpc('reabrir_precificacao',{p_id:id,p_motivo:m}));go('edit',id)});

/* ---------- Cadastros (por categoria) e taxas ---------- */
async function vCad(){
  const[pr,tx]=await Promise.all([loadProds(),q(sb.from('taxas_cartao').select('*').order('vigente_desde',{ascending:false})),procLoad()]);
  CAD=pr;
  const lt={};tx.forEach(t=>{const k=t.forma+(t.parcelas||'');if(!lt[k])lt[k]=t});
  const T=Object.values(lt).sort((a,b)=>a.forma<b.forma?1:a.forma>b.forma?-1:a.parcelas-b.parcelas);
  return`<div class="ph"><h2>Cadastros</h2></div>${procCard()}<div class="card"><div class="sh"><h3>Produtos e materiais</h3><button class="b sm" onclick="go('prod','novo')">+ Novo</button></div>
  <input id="cad_q" placeholder="Buscar produto…" value="${esc(cadQ)}" oninput="cadQ=this.value;cadRender()" autocomplete="off"><div id="cadlist"></div></div>
  <div class="card"><h3>Taxas da maquininha</h3><div class="m">Alterar cria uma nova versão; precificações concluídas não mudam.</div>
  ${T.map(t=>`<div class="row"><span>${t.forma==='debito'?'Débito':t.parcelas+'x crédito'}</span><span>${t.percentual}% <a class="l" onclick="novaTaxa('${t.forma}',${t.parcelas})">alterar</a></span></div>`).join('')}</div>`;
}
function cadRender(){
  const el=document.getElementById('cadlist');if(!el)return;
  const t=norm(cadQ);
  const row=p=>`<div class="row"><a class="l" onclick="go('prod','${p.id}')">${esc(p.nome)}</a><span class="m">${pkInfo(p)}</span></div>`;
  el.innerHTML=CATS.map(([k,n])=>{
    const all=CAD.filter(p=>p.cat===k),l=all.filter(p=>!t||norm(p.nome).includes(t));
    if(t&&!l.length)return'';
    const body=l.map(row).join('')||'<div class="m e">Nenhum produto.</div>';
    const open=t?true:!!cadOpen[k];
    return`<details class="cat" ${open?'open':''} ontoggle="if(!cadQ)cadOpen['${k}']=this.open"><summary><span>${n}</span><span class="m">${all.length} item(ns)</span></summary>${body}<button class="b g sm" onclick="go('prod','novo:${k}')">+ Novo em ${n}</button></details>`}).join('')||'<div class="m">Nenhum produto encontrado.</div>';
}
async function vProd(id){
  const isNew=String(id).startsWith('novo'),pt=String(id).split(':');
  let p={nome:'',unidade:'',categoria:isNew?(pt[1]||''):''},u={};
  if(!isNew){p=await q(sb.from('produtos').select('id,nome,unidade,categoria,produto_precos(preco_embalagem,rendimento,vigente_desde)').eq('id',id).single());u=p.produto_precos.sort((a,b)=>b.vigente_desde.localeCompare(a.vigente_desde))[0]||{}}
  return`<a class="l" onclick="go('cad')">← Cadastros</a><div class="ph"><h2>${isNew?'Novo produto':'Editar produto'}</h2></div><div class="card">
  <label>Nome</label><input id="c_n" value="${esc(p.nome)}">
  <label>Categoria</label><select id="c_c"><option value="">— escolher —</option>${CATS.map(([k,n])=>`<option value="${k}" ${p.categoria===k?'selected':''}>${n}</option>`).join('')}</select>
  <label>Unidade (opcional, ex.: UI, embalagem, ml)</label><input id="c_u" value="${esc(p.unidade||'')}">
  <label>Preço total pago (R$)</label><input id="c_p" value="${esc(nv(u.preco_embalagem))}" placeholder="0,00" inputmode="decimal">
  <label>Rendimento total (quanto rende tudo que você comprou)</label><input id="c_r" value="${esc(nv(u.rendimento))}" placeholder="0" inputmode="decimal">
  <label>Comprou mais de uma embalagem? (opcional) Uma por linha: preço / rendimento. O app soma tudo e usa no lugar dos dois campos acima.</label>
  <textarea id="c_e" rows="3" placeholder="700 / 200&#10;778 / 100"></textarea>
  <button class="b" onclick="salvaProd('${id}')">Salvar</button>${isNew?'':`<button class="b g" onclick="arqProd('${id}')">Arquivar</button><button class="x" onclick="excProd('${id}')">Excluir</button>`}
  <div class="m">Mudar preço ou rendimento vale só para as próximas precificações. As concluídas guardam os valores da época e não mudam.</div></div>`;
}
window.salvaProd=run(async id=>{
  const isNew=String(id).startsWith('novo');
  let pr=N(G('c_p')),rd=N(G('c_r'));const ln=G('c_e').split('\n').map(l=>l.split('/')).filter(a=>a.length===2&&N(a[1]));
  if(ln.length){pr=ln.reduce((s,a)=>s+N(a[0]),0);rd=ln.reduce((s,a)=>s+N(a[1]),0)}
  const n=G('c_n').trim(),cat=G('c_c');
  if(!n||!rd)return alert('Informe ao menos o nome e o rendimento.');
  if(!cat)return alert('Escolha a categoria.');
  const campos={nome:n,unidade:G('c_u').trim()||null,categoria:cat};
  if(cat!=='consumo')campos.subcategoria=null;
  if(isNew)id=(await q(sb.from('produtos').insert(campos).select('id').single())).id;else await q(sb.from('produtos').update(campos).eq('id',id));
  const l=(await q(sb.from('produto_precos').select('preco_embalagem,rendimento').eq('produto_id',id).order('vigente_desde',{ascending:false}).limit(1)))[0];
  if(!l||Number(l.preco_embalagem)!==pr||Number(l.rendimento)!==rd)await q(sb.from('produto_precos').insert({produto_id:id,preco_embalagem:pr,rendimento:rd}));
  PC=null;go('cad')});
window.arqProd=run(async id=>{if(!confirm('Arquivar? Ele some da lista, e as precificações antigas continuam intactas.'))return;await q(sb.from('produtos').update({ativo:false}).eq('id',id));PC=null;go('cad')});
window.excProd=run(async id=>{
  if(!confirm('Excluir este produto? Se ele já foi usado em alguma precificação, será apenas arquivado para preservar o histórico.'))return;
  const r=await q(sb.rpc('excluir_produto',{p_id:id}));PC=null;
  alert(r==='arquivado'?'Este produto já foi usado em precificações, então foi arquivado (sai das listas e o histórico fica preservado).':'Produto excluído.');go('cad')});
window.novaTaxa=run(async(f,pa)=>{const v=prompt('Nova taxa (%):');if(v===null||v==='')return;await q(sb.from('taxas_cartao').insert({forma:f,parcelas:pa||null,percentual:N(v)}));go('cad')});
/* Backup: o servidor devolve no máximo 1000 linhas por pedido; por isso cada tabela é lida em blocos de 1000 (ordenados por id) até acabar */
const lerTudo=async t=>{let o=[],i=0,n;do{const r=await q(sb.from(t).select('*').order('id').range(i,i+999));o=o.concat(r);n=r.length;i+=1000}while(n===1000);return o};
window.backup=run(async()=>{
  const out={gerado_em:new Date().toISOString()};
  for(const t of['pacientes','dias_atendimento','dia_custos','itens_custo_nomes','produtos','produto_precos','procedimentos','taxas_cartao','precificacoes','precificacao_materiais','sessoes','snapshots','historico_alteracoes'])out[t]=await lerTudo(t);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='backup-consultorio-'+hoje()+'.json';a.click();
});

/* ---------- Conta (menu principal) ---------- */
async function vConta(){
  const s=await ensure(),u=s?s.user:{};
  return`<div class="ph"><h2>Conta</h2></div><div class="card"><h3>Informações da conta</h3>
  <div class="row"><span>E-mail</span><span class="r">${esc(maskEmail(u.email))}</span></div>
  <div class="row"><span>Conta criada em</span><span class="r">${u.created_at?dt(u.created_at):'—'}</span></div>
  <div class="row"><span>Último acesso</span><span class="r">${u.last_sign_in_at?dt(u.last_sign_in_at):'—'}</span></div></div>
  <div class="card"><h3>Aparência</h3><div class="row"><span class="grow" style="display:flex;align-items:center;gap:10px"><span style="color:var(--a);display:grid">${ic('moon')}</span><span>Modo escuro<br><span class="m">Alterna entre a versão clara e a escura</span></span></span><button type="button" class="tgl" role="switch" aria-checked="${isDark()}" aria-label="Modo escuro" onclick="toggleTema(this)"></button></div></div>
  <div class="card"><h3>Alterar senha</h3><label>Senha atual</label><input id="cp_a" type="password" autocomplete="current-password"><label>Nova senha (mínimo 8 caracteres)</label><input id="cp_n" type="password" autocomplete="new-password"><label>Confirmar nova senha</label><input id="cp_c" type="password" autocomplete="new-password"><button class="b" onclick="trocaSenha()">Alterar senha</button></div>
  <div class="card"><h3>Dados e sessão</h3><button class="b g" onclick="backup()">Exportar backup (JSON)</button><button class="b g" onclick="sair()">Sair da conta</button></div>`;
}

/* ---------- Enter: mesma ação do botão principal do formulário (sem enviar duas vezes) ---------- */
const ENT={em:()=>login(),pw:()=>login(),fg_em:()=>esqueci(),n_p:()=>criar(),n_n:()=>criar(),n_pr:()=>criar(),p_n:()=>addPac(),p_t:()=>addPac(),pn_n:()=>pacSalvarNome(arg),
  m_q:()=>addMat(PK.pid),s_data:()=>addSes(arg),s_rq:()=>addSes(arg),cp_a:()=>trocaSenha(),cp_n:()=>trocaSenha(),cp_c:()=>trocaSenha(),rec_n:()=>novaSenhaRec(),rec_c:()=>novaSenhaRec(),
  c_n:()=>salvaProd(arg),c_u:()=>salvaProd(arg),c_p:()=>salvaProd(arg),c_r:()=>salvaProd(arg)};
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.repeat)return;
  const t=e.target;if(!t||t.tagName!=='INPUT'||['checkbox','button','radio'].includes(t.type))return;
  const id=t.id||'';
  if(id==='pk_q'||id==='cad_q'||id==='h_q'||id==='p_q'){e.preventDefault();return}
  if(id.startsWith('rq_')){e.preventDefault();rqSave(id.slice(3));return}
  let fn=ENT[id];
  if(!fn&&nav==='edit'&&/^f_(mg|im|ou|tt|dv|dp|dj|ca|px|pa|cb)$/.test(id)&&!t.disabled)fn=()=>salvar(arg);
  if(!fn)return;
  e.preventDefault();fn();
});

/* ---------- Gestos: arrastar para o lado volta ou troca de aba ---------- */
const TABS=['home','nova','pac','hist','cad','conta'];
function swipe(dir){
  let alvo=null;
  const pai=nav==='edit'?'hist':nav==='prod'?'cad':(nav==='pac'&&arg)?'pac':null;
  if(pai){if(dir==='r')alvo=pai}
  else{const i=TABS.indexOf(nav),j=dir==='r'?i-1:i+1;if(i>=0&&j>=0&&j<TABS.length)alvo=TABS[j]}
  if(!alvo)return;
  if(DIRTY&&!confirm('Há alterações não salvas. Sair mesmo assim?'))return;
  ANIM=dir;if(pai)go(alvo);else tab(alvo);
}
document.addEventListener('touchstart',e=>{const t=e.touches[0];SW=(e.touches.length===1&&t.clientX>16)?{x:t.clientX,y:t.clientY,el:e.target}:null},{passive:true});
document.addEventListener('touchend',e=>{
  if(!SW)return;const t=e.changedTouches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y,el=SW.el;SW=null;
  if(Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*.5)return;
  if(el&&el.closest&&el.closest('input,textarea,select,.plist,.ov,.gfseg,.gf-svg'))return;
  swipe(dx>0?'r':'l')},{passive:true});
const liveIds=/^f_(mg|im|ou|tt|dv|dp|ca|px|pa|cb|fm)$/;
document.addEventListener('input',e=>{const id=e.target.id||'';if(!['pk_q','cad_q','h_q','p_q'].includes(id)&&!id.startsWith('cx_')&&!id.startsWith('pr_'))DIRTY=true;if(nav==='edit'&&liveIds.test(id))liveSched()});
document.addEventListener('change',e=>{const id=e.target.id||'';if(nav==='edit'&&liveIds.test(id))liveSched()});
sb.auth.onAuthStateChange((ev,s)=>{SESS=s;if(ev==='PASSWORD_RECOVERY'){RECOV=true;setTimeout(draw,0)}else if(ev==='SIGNED_OUT'){VC={};setTimeout(draw,0)}});

/* ---------- Sessão: sai sozinho se o app ficou fechado ou em segundo plano por mais de 5 minutos ---------- */
/* Um "visto por último" é gravado a cada 20 s enquanto o app está rodando. Com o app fechado (ou o celular
   com o app em segundo plano) nada é gravado; ao voltar, se passou de 5 min, a sessão deste aparelho é encerrada. */
const LS_SEEN='consultorio_visto',AWAY_MS=5*60*1000;
const touch=()=>{try{localStorage.setItem(LS_SEEN,String(Date.now()))}catch(e){}};
async function checkAway(){
  if(RECOV)return false;
  let last=0;try{last=Number(localStorage.getItem(LS_SEEN))||0}catch(e){}
  if(!last||Date.now()-last<=AWAY_MS)return false;
  if(!(await ensure()))return false;
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  SESS=null;VC={};LM='login';nav='home';arg=null;return true;
}
const tick=async()=>{if(await checkAway())draw();else touch()};
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)touch();else tick()});
window.addEventListener('pageshow',tick);
window.addEventListener('pagehide',touch);
(async()=>{await checkAway();touch();draw()})();
</script></body></html>
